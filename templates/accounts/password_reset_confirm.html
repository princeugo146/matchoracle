{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="wrap" style="max-width:440px;margin:70px auto">
  <div style="text-align:center;margin-bottom:28px">
    <div style="font-size:40px;margin-bottom:12px">✅</div>
    <div style="font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px">Set New Password</div>
    <div style="color:var(--text2);font-size:14px">Identity verified. Choose a strong new password.</div>
  </div>
  <div class="card">
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'success' %}al-s{% elif message.tags == 'error' %}al-e{% else %}al-i{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="POST" novalidate>
      {% csrf_token %}
      <div class="field">
        <label>New Password</label>
        <input type="password" name="password1" placeholder="At least 8 characters" required autofocus>
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" name="password2" placeholder="Repeat your new password" required>
      </div>
      <button type="submit" class="btn btn-p btn-full" style="margin-top:8px;padding:13px">Reset Password</button>
    </form>
    <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--text2)">
      <a href="{% url 'login' %}" style="color:var(--accent);font-weight:600">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
