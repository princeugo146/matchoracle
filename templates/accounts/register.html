{% extends 'base.html' %}
{% block title %}Sign Up Free{% endblock %}
{% block content %}
<div class="wrap" style="max-width:460px;margin:70px auto">
  <div style="text-align:center;margin-bottom:28px">
    <div style="font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px">Create Account</div>
    <div style="color:var(--text2);font-size:14px">3 free predictions per day - no credit card needed</div>
  </div>
  <div class="card">
    {% if error %}<div class="alert al-e">{{ error }}</div>{% endif %}
    <form method="post" novalidate>{% csrf_token %}
      <div class="field"><label>Email Address</label><input type="email" name="email" placeholder="your@email.com" required autofocus></div>
      <div class="field"><label>First Name (optional)</label><input type="text" name="first_name" placeholder="Your name"></div>
      <div class="field"><label>Password (min 6 characters)</label><input type="password" name="password" placeholder="Choose a password" required></div>
      <div class="field"><label>Confirm Password</label><input type="password" name="password2" placeholder="Repeat password" required></div>
      <button type="submit" class="btn btn-p btn-full" style="margin-top:8px;padding:13px">Create Free Account</button>
    </form>
    <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--text2)">Already have an account? <a href="/accounts/login/" style="color:var(--accent);font-weight:600">Login</a></div>
  </div>
</div>
{% endblock %}
