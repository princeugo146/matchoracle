name: Build Android APK

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  # Manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

  # Automatically build on every version tag (e.g. v2.0.1)
  push:
    tags:
      - 'v*.*.*'

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (required by AGP 8.x) ─────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Set up Node.js (for Capacitor CLI) ────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install Capacitor dependencies ────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # ── 5. Sync Capacitor (copies config into Android project) ───────────
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── 6. Decode and write keystore (release builds only) ───────────────
      - name: Decode keystore
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/matchoracle.keystore

      # ── 7. Write signing-config.properties (release builds only) ─────────
      - name: Write signing config
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          cat > android/app/signing-config.properties <<EOF
          storeFile=${{ github.workspace }}/android/app/matchoracle.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── 8. Make Gradle wrapper executable ────────────────────────────────
      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      # ── 9. Build release APK ─────────────────────────────────────────────
      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/') }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # ── 10. Build debug APK ──────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 11. Upload APK as workflow artifact ──────────────────────────────
      - name: Upload release APK artifact
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: matchoracle-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload debug APK artifact
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: matchoracle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── 12. Create GitHub Release (tag builds only) ──────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: MatchOracle ${{ github.ref_name }}
          body: |
            ## MatchOracle Android ${{ github.ref_name }}

            ### Installation
            1. Download `app-release.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK to install

            ### What's included
            - MatchOracle web app wrapped in a native Android WebView
            - Loads from: https://matchoracle-production.up.railway.app
            - Minimum Android version: 5.1 (API 22)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─── Required GitHub Secrets ──────────────────────────────────────────────────
# Set these in: Settings → Secrets and variables → Actions
#
#   KEYSTORE_BASE64    — base64-encoded matchoracle.keystore file
#                        Generate: base64 -i matchoracle.keystore | pbcopy
#   KEYSTORE_PASSWORD  — password used when creating the keystore
#   KEY_ALIAS          — alias chosen during keytool -genkey (e.g. "matchoracle")
#   KEY_PASSWORD       — password for the key (often same as KEYSTORE_PASSWORD)
