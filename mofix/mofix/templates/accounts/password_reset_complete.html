{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="wrap" style="max-width:480px;margin:70px auto">
  <div class="card" style="text-align:center;padding:40px 32px">
    <div style="font-size:52px;margin-bottom:16px">✅</div>
    <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;margin-bottom:12px">Password Updated!</div>
    <p style="color:var(--text2);font-size:14px;line-height:1.7;margin-bottom:28px">
      Your password has been successfully reset. You can now log in to your MatchOracle account with your new password.
    </p>
    <a href="/accounts/login/" class="btn btn-p btn-full" style="padding:13px">Login to Dashboard</a>
  </div>
</div>
{% endblock %}
