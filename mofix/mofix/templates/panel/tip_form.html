{% extends 'panel/admin_base.html' %}
{% block title %}{{ action }} Tip{% endblock %}
{% block page_title %}{{ action }} Weekly Tip{% endblock %}
{% block nav_tips %}active{% endblock %}

{% block content %}
<div style="margin-bottom:16px">
  <a href="/panel/tips/" class="btn btn-s btn-sm">← Back to Tips</a>
</div>

<div class="card" style="max-width:700px">
  <form method="post">
    {% csrf_token %}
    <div class="g2">
      <div class="field">
        <label>Title *</label>
        <input type="text" name="title" value="{{ tip.title|default:'' }}" placeholder="e.g. Arsenal vs Chelsea — Premier League" required>
      </div>
      <div class="field">
        <label>Competition</label>
        <input type="text" name="competition" value="{{ tip.competition|default:'Premier League' }}" placeholder="Premier League">
      </div>
    </div>
    <div class="g2">
      <div class="field">
        <label>Home Team *</label>
        <input type="text" name="home_team" value="{{ tip.home_team|default:'' }}" placeholder="Arsenal" required>
      </div>
      <div class="field">
        <label>Away Team *</label>
        <input type="text" name="away_team" value="{{ tip.away_team|default:'' }}" placeholder="Chelsea" required>
      </div>
    </div>
    <div class="g2">
      <div class="field">
        <label>Match Date & Time *</label>
        <input type="datetime-local" name="match_date"
          value="{% if tip.match_date %}{{ tip.match_date|date:'Y-m-d' }}T{{ tip.match_date|time:'H:i' }}{% endif %}" required>
      </div>
      <div class="field">
        <label>Confidence (%) *</label>
        <input type="number" name="confidence" value="{{ tip.confidence|default:70 }}" min="1" max="100" required>
      </div>
    </div>
    <div class="field">
      <label>Tip / Prediction *</label>
      <input type="text" name="tip" value="{{ tip.tip|default:'' }}" placeholder="e.g. Home Win, Over 2.5 Goals, BTTS Yes" required>
    </div>
    <div class="field">
      <label>Description / Analysis</label>
      <textarea name="description" rows="4" placeholder="Detailed analysis and reasoning for this tip…">{{ tip.description|default:'' }}</textarea>
    </div>
    {% if tip %}
    <div class="field">
      <label>Result</label>
      <select name="result">
        <option value="" {% if not tip.result %}selected{% endif %}>Pending</option>
        <option value="win" {% if tip.result == 'win' %}selected{% endif %}>Win ✅</option>
        <option value="loss" {% if tip.result == 'loss' %}selected{% endif %}>Loss ❌</option>
        <option value="void" {% if tip.result == 'void' %}selected{% endif %}>Void</option>
      </select>
    </div>
    {% endif %}
    <div style="display:flex;gap:20px;margin-bottom:20px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)">
        <input type="checkbox" name="is_published" {% if tip.is_published or not tip %}checked{% endif %} style="width:auto">
        Published (visible to users)
      </label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)">
        <input type="checkbox" name="is_pro_only" {% if tip.is_pro_only %}checked{% endif %} style="width:auto">
        Pro Only
      </label>
    </div>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-admin">{{ action }} Tip</button>
      <a href="/panel/tips/" class="btn btn-s">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
