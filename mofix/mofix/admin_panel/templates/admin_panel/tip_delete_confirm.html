{% extends 'base.html' %}
{% block title %}Delete Tip{% endblock %}
{% block content %}
<div class="wrap" style="max-width:480px;margin:60px auto">
  <div class="card" style="text-align:center;padding:40px">
    <div style="font-size:48px;margin-bottom:16px">🗑️</div>
    <div style="font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;margin-bottom:10px;color:var(--red)">Delete Tip</div>
    <div style="color:var(--text2);font-size:14px;margin-bottom:6px">You are about to delete:</div>
    <div style="font-weight:700;font-size:16px;margin-bottom:4px">{{ tip.home_team }} vs {{ tip.away_team }}</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:24px">{{ tip.competition }} — {{ tip.match_date|date:"d M Y" }}</div>
    <form method="post" style="display:flex;gap:10px">{% csrf_token %}
      <button type="submit" class="btn" style="flex:1;background:var(--red);color:white;padding:12px">Delete</button>
      <a href="{% url 'admin_tips_list' %}" class="btn btn-s" style="flex:1;padding:12px;text-align:center">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
